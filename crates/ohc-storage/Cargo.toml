# SPDX-License-Identifier: Apache-2.0

[package]
name = "ohc-storage"
version = "0.4.47"
edition = "2024"
license = "Apache-2.0"
description = "Unified single-tenant SQLite (SQLCipher) and portable PostgreSQL storage migrations for OneHumanCorp Community Edition."

[dependencies]
libsqlite3-sys = { version = "0.30.1", features = ["bundled-sqlcipher"] }
sqlx = { version = "0.8", features = ["postgres", "sqlite", "runtime-tokio-native-tls", "chrono", "uuid", "macros", "migrate"] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
libsqlite3-sys = { version = "0.30.1", features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["full"] }
