# OneHumanCorp Community Edition — Standalone Single-Tenant Docker Compose
#
# Default stack (`docker compose up -d --build`):
#   - `server`: Single-tenant Rust API + built-in agent with encrypted SQLCipher SQLite
#   - `web`:    Next.js web application (Omni Assistant Task Center & business workspace)
#
# Optional profiles:
#   - `--profile postgres`: Self-hosted single-tenant PostgreSQL (pgvector)
#   - `--profile ollama`:   Local open-weights LLM inference via Ollama
#
# Quick start:
#   ./deploy/scripts/prepare-compose-env.sh
#   docker compose --env-file .omnisolo-compose/compose.env \
#     -f deploy/docker-compose.yml up -d --build

services:
  server:
    build:
      context: ..
      dockerfile: deploy/docker/server/Dockerfile
      target: server
    image: ${OMNISOLO_SERVER_IMAGE:-omnisolo/server:latest}
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      PORT: "8080"
      OMNISOLO_PORT: "8080"
      OMNISOLO_GRPC_PORT: "8081"
      OMNISOLO_STANDALONE_MODE: "${OMNISOLO_STANDALONE_MODE:-true}"
      OMNISOLO_SOURCE_MODE: "standalone"
      OMNISOLO_HEADLESS: "${OMNISOLO_HEADLESS:-false}"
      OMNISOLO_RUNTIME_DIR: "/data"
      OMNISOLO_AUTH_RATE_LIMIT_DEPLOYMENT: "single-instance"
      OMNISOLO_TELEMETRY_ENABLED: "${OMNISOLO_TELEMETRY_ENABLED:-false}"
      OMNISOLO_BUILTIN_AGENT_BINARY: "/usr/local/bin/omnisolo-builtin-agent"
      # Defaults to encrypted SQLCipher SQLite inside the persistent /data volume.
      # When using `--profile postgres`, override DATABASE_URL to point at postgres:5432.
      DATABASE_URL: "${DATABASE_URL:-sqlite:///data/omnisolo-standalone.db?mode=rwc}"
      OMNISOLO_SQLITE_KEY: "${OMNISOLO_SQLITE_KEY:?OMNISOLO_SQLITE_KEY is required (run ./deploy/scripts/prepare-compose-env.sh)}"
      JWT_SECRET_FILE: /run/secrets/jwt-secret
      OMNISOLO_SETUP_TOKEN_FILE: /run/secrets/setup-token
      # Optional BYOK or local Ollama provider settings.
      OMNISOLO_LLM_PROVIDER: "${OMNISOLO_LLM_PROVIDER:-}"
      OMNISOLO_LLM_MODEL: "${OMNISOLO_LLM_MODEL:-}"
      OMNISOLO_LLM_BASE_URL: "${OMNISOLO_LLM_BASE_URL:-}"
      OMNISOLO_LLM_API_KEY: "${OMNISOLO_LLM_API_KEY:-}"
      OMNISOLO_LOCAL_LLM_ENDPOINT: "${OMNISOLO_LOCAL_LLM_ENDPOINT:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      MINIMAX_API_KEY: "${MINIMAX_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OMNISOLO_AGENT_TASK_TIMEOUT_SECS: "${OMNISOLO_AGENT_TASK_TIMEOUT_SECS:-240}"
      OMNISOLO_LLM_TIMEOUT_SECS: "${OMNISOLO_LLM_TIMEOUT_SECS:-180}"
    volumes:
      - omnisolo-data:/data
      - ${JWT_SECRET_FILE:?JWT_SECRET_FILE is required}:/run/secrets/jwt-secret:ro
      - ${OMNISOLO_SETUP_TOKEN_FILE:?OMNISOLO_SETUP_TOKEN_FILE is required}:/run/secrets/setup-token:ro
    ports:
      - "${OMNISOLO_DOCKER_SERVER_PORT:-127.0.0.1:8080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/docker/web/Dockerfile
    image: ${OMNISOLO_WEB_IMAGE:-omnisolo/web:latest}
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: "production"
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      BACKEND_URL: "http://server:8080"
      OMNISOLO_WEB_CANONICAL_ORIGIN: "${OMNISOLO_WEB_CANONICAL_ORIGIN:-http://127.0.0.1:3000}"
      OMNISOLO_WEB_LOCAL_DEV: "${OMNISOLO_WEB_LOCAL_DEV:-true}"
      OMNISOLO_WEB_SESSION_SECRET: "${OMNISOLO_WEB_SESSION_SECRET:?OMNISOLO_WEB_SESSION_SECRET is required (run ./deploy/scripts/prepare-compose-env.sh)}"
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${OMNISOLO_DOCKER_WEB_PORT:-127.0.0.1:3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  postgres:
    profiles: ["postgres"]
    image: pgvector/pgvector:pg15@sha256:18d16372b8406bb38a9f94cbff15d125c463d71fde2770aa8b5c64bfcc1578ee
    pull_policy: missing
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: "${OMNISOLO_POSTGRES_USER:-ohc}"
      POSTGRES_DB: "${OMNISOLO_POSTGRES_DB:-ohc}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_MULTIPLE_DATABASES: "${OMNISOLO_POSTGRES_DB:-ohc}"
    volumes:
      - ./docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
      - postgres-data:/var/lib/postgresql/data
      - ${OMNISOLO_POSTGRES_PASSWORD_FILE:?OMNISOLO_POSTGRES_PASSWORD_FILE is required}:/run/secrets/postgres-password:ro
    ports:
      - "${OMNISOLO_DOCKER_POSTGRES_PORT:-127.0.0.1:5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OMNISOLO_POSTGRES_USER:-ohc} -d ${OMNISOLO_POSTGRES_DB:-ohc}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ollama:
    profiles: ["ollama"]
    image: ${OMNISOLO_OLLAMA_IMAGE:-ollama/ollama:latest}
    pull_policy: missing
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "${OMNISOLO_DOCKER_OLLAMA_PORT:-127.0.0.1:11434}:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  omnisolo-data:
  postgres-data:
  ollama-data:
