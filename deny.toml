# OneHumanCorp dependency license and supply-chain policy (`cargo-deny`).
# Allows only permissive and weak-copyleft SPDX licenses; all unlisted licenses
# — including strong-copyleft (AGPL-*, GPL-*, LGPL-*) and source-available
# licenses (SSPL-*, BUSL-*, BSL-*) — are denied automatically.

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "warn"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
# Permissive and weak-copyleft SPDX allowlist (strong-copyleft AGPL/GPL and
# source-available SSPL/BSL/BUSL licenses are excluded and therefore denied).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "NCSA",
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
